# The curated catalogue — the only models the advisor will recommend.
#
# This file is DATA. The docs never count it ("the curated families", never
# "the 12 families" — product rule 8). internal/catalog loads it strictly
# (unknown keys are errors) and validates it; `advisor catalog check` runs
# the same checks offline. `advisor catalog refresh` resolves every size to
# per-quant GGUF metadata from Hugging Face — file sizes from the Hub
# listing, header fields from a range read of each file's first bytes — and
# never downloads weights.
#
# Schema (mirrors catalog.Catalogue / catalog.Family in
# internal/catalog/catalog.go):
#
#   quants: [Q4_K_M, ...]          # the quant variants the advisor tracks, as the
#                                  # file names spell them (upper case). Files
#                                  # with other quants are listed by the Hub but
#                                  # not header-read or stored.
#   families:
#     - id: llama3.1               # stable key: lower case, digits, '.', '-'
#       display_name: Llama 3.1    # what the UI shows
#       maintainer: Meta           # who publishes the weights
#       license:
#         spdx: Apache-2.0         # the SPDX id where one exists...
#         name: Llama 3.1 Community License Agreement  # ...otherwise the name
#         url: https://...         # and where to read it (url is required with name)
#       purposes: [chat, writing]  # what it is credible for. The enum is
#                                  # catalog.Purpose, shared with the UI:
#                                  # coding, chat, reasoning, long_context,
#                                  # vision, agentic, writing
#       reviewed_at: 2026-09-18    # when a person last checked this entry
#       source: https://...        # where they checked it (the model card)
#       notes: ""                  # optional, for the curator and step 5
#       sizes:
#         - parameters: 8030000000 # total parameter count, from the model card
#           active_parameters: 0   # optional: parameters used per token when
#                                  # fewer than all are (mixture-of-experts;
#                                  # Gemma's per-layer-embedding "E" sizes).
#                                  # Omitted = dense, all of them.
#           context_length: 131072 # trained context, from the model card
#           ollama_tag: llama3.1:8b          # what a beginner would pull
#           hf_repo: owner/repo-GGUF         # the GGUF repo used for metadata
#
# Choosing hf_repo: an ungated repo that publishes the tracked quants under
# llama.cpp's standard names (bartowski's where it exists, else ggml-org or
# the maintainer's own), with the vision encoder as an mmproj file when the
# model has one. The refresh reports a size that does not resolve; it never
# guesses a substitute.
#
# Mixture-of-experts sizes (active_parameters set) and multimodal families
# (purpose vision) are in the catalogue. How the estimator treats them is
# step 5's decision (ARCHITECTURE.md D-20, finding 5; D-32 here).

quants: [Q3_K_M, IQ4_XS, Q4_K_M, Q5_K_M, Q6_K, Q8_0, MXFP4]

families:
  - id: qwen3.5
    display_name: Qwen3.5
    maintainer: Qwen (Alibaba Cloud)
    license:
      spdx: Apache-2.0
    purposes: [chat, coding, reasoning, agentic, vision, long_context]
    reviewed_at: 2026-09-18
    source: https://huggingface.co/Qwen/Qwen3.5-9B
    notes: >-
      The small sizes of the Qwen3.5 generation (the larger ones are
      superseded by Qwen3.6 and Qwen3.8 below). Hybrid attention: Gated
      DeltaNet layers with full attention every fourth layer
      (full_attention_interval in the header), so only a quarter of the layers
      keep a KV cache. Natively multimodal; the vision encoder is a separate
      mmproj file.
    sizes:
      - parameters: 800000000
        context_length: 262144
        ollama_tag: qwen3.5:0.8b
        hf_repo: bartowski/Qwen_Qwen3.5-0.8B-GGUF
      - parameters: 2000000000
        context_length: 262144
        ollama_tag: qwen3.5:2b
        hf_repo: bartowski/Qwen_Qwen3.5-2B-GGUF
      - parameters: 4000000000
        context_length: 262144
        ollama_tag: qwen3.5:4b
        hf_repo: bartowski/Qwen_Qwen3.5-4B-GGUF
      - parameters: 9000000000
        context_length: 262144
        ollama_tag: qwen3.5:9b
        hf_repo: bartowski/Qwen_Qwen3.5-9B-GGUF

  - id: qwen3.6
    display_name: Qwen3.6
    maintainer: Qwen (Alibaba Cloud)
    license:
      spdx: Apache-2.0
    purposes: [coding, agentic, reasoning, chat, vision, long_context]
    reviewed_at: 2026-09-18
    source: https://huggingface.co/Qwen/Qwen3.6-35B-A3B
    notes: >-
      Only the mixture-of-experts size: 35B total, about 3B used per token, so
      it runs quickly on a machine with plenty of memory but a modest graphics
      card. Qwen3.6's 27B is superseded by Qwen3.8 27B.
    sizes:
      - parameters: 35000000000
        active_parameters: 3000000000
        context_length: 262144
        ollama_tag: qwen3.6:35b
        hf_repo: bartowski/Qwen_Qwen3.6-35B-A3B-GGUF

