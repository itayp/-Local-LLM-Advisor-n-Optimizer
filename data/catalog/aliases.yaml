# What each external source calls the catalogue's sizes (build-plan step 9b).
#
# This file is DATA. A source's model name maps to ONE catalogue size —
# family id and parameter count, exactly as families.yaml has them — or to
# nothing. The rules (research/EXTERNAL_SOURCES.md, "Common to all three"):
#
#   - Exact strings only. The advisor never fuzzy-matches a name at runtime;
#     a name that is not here is not the catalogue's, however close it looks.
#   - Per size, never per family. No score is copied from one size to another,
#     from a family to a size, or from one variant to another the source did
#     not test. A source that rates "Model 27B" says nothing about "Model 9B".
#   - One variant. Where a source lists effort variants of a hosted run
#     ("(High)", "(Max)"), the alias pins the one that matches how Ollama runs
#     the model by default, or none.
#   - A miss is a curator flag, never a guess: `advisor catalog external
#     -report` lists the catalogue sizes a source has no alias for and the
#     source's open-licence names nothing here maps (with the closest
#     catalogue family, as a suggestion it never writes here itself).
#
# Hugging Face Eval Results needs no aliases: it is read from each size's
# own original repo (hf_base_repo in families.yaml).
#
# Schema (mirrors external.Aliases in internal/catalog/external/config.go):
#
#   arena:                         # an approved source id from external.yaml
#     - name: llama-3.3-70b-instruct   # the source's exact model name
#       family: llama3.3               # a family id in families.yaml
#       parameters: 70600000000        # that family's size, exactly as listed there
#       reviewed_at: 2026-09-24        # when a person last checked the pairing
#       note: ...                      # optional: why, and anything unconfirmed
#
# The arena entries marked "Unconfirmed" were written on 2026-09-24 before
# any live response had been read. The first coverage report
# (scripts/verify.command, 2026-09-24 20:58, the M1 Pro) read Arena's text
# and vision boards down to row 200 before the dataset viewer answered HTTP
# 500 ("the dataset index is loading"), and Epoch's whole ZIP; the entries
# marked "Seen" are names those answers contained, checked by hand against
# the catalogue size. A row below 200 of Arena's boards (the Llama and
# gpt-oss names) is still unconfirmed until a full read.
#
# Names deliberately NOT mapped (a curator's "looks like" is not a match):
#   - Epoch "qwen3-8b", "deepseek-r1-0528-qwen3-8b": Qwen3 8B (2025), not
#     Qwen3.8 — the report's suggestion squashes "qwen3-8b" into "qwen38".
#   - Epoch "ministral-3b-2410", "ministral-8b-2410": the October 2024
#     Ministral, not Ministral 3 (2512).
#   - Epoch "qwen3.6-27b": the catalogue's 27B is Qwen3.8, not Qwen3.6.
#   - Epoch "qwen3.5-2b_none", "qwen3.5-4b_none" and every other "_none"
#     run: thinking switched off; Ollama runs these families with thinking
#     on, and Epoch lists no thinking-on run of those two sizes.
#   - Epoch "gpt-oss-20b_low" / "_high": gpt-oss:20b runs at medium effort
#     in Ollama unless told otherwise; "_medium" is the one mapped.
#   - Arena "qwen3.5-35b-a3b", "qwen3.5-27b": sizes the catalogue does not
#     list (its 35B-A3B is Qwen3.6, its 27B Qwen3.8).

