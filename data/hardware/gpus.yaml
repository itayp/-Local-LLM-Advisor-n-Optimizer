# Memory bandwidth of consumer graphics parts and of the memory consumer
# processors use — the one hardware number the speed estimate turns on
# (internal/estimate/speed.go):
#
#   generation tok/s  ≈  memory bandwidth ÷ bytes read per token  × efficiency
#
# A part that is not in this file gets NO speed estimate, and the UI says so
# in words; the advisor never invents a number (ARCHITECTURE.md D-21). Adding
# a row is the fix.
#
# This file is DATA. It is embedded in the binary (package advisor/data) and
# read by internal/estimate/devices.go, whose DeviceFile type mirrors it;
# unknown keys are errors. devices_test.go is its contract: every row that
# states a memory configuration must satisfy
#
#   bandwidth_gbs = data_rate_gbps × bus_width_bits ÷ 8        (within 1%)
#
# which is how the vendors' own figures are derived, so a typo in either
# cannot survive; and a list of real device names must land on the rows they
# should (the order of the rows matters, see below).
#
# Schema:
#
#   sources:                       # where rows were taken from; a row names one
#     some-id: citation, URL
#
#   gpus:                          # ORDERED. For an ordinary name the first row
#     - id: rtx-4090               # whose conditions all hold decides — so a
#       vendor: nvidia             # laptop part sits above the desktop part of
#       name: ['RTX 4090']         # the same name, "Ti SUPER" above "Ti" above
#       min_vram_gib: 11           # the plain model. For a name that lists
#       max_vram_gib: 13           # several cards (Linux's pci.ids writes "RX
#       gpu_cores: [30]            # 7900 XT/7900 XTX/7900 GRE" for one chip
#       bandwidth_gbs: 1008        # id), every matching row is considered and
#       data_rate_gbps: 21         # the slowest wins, with a note.
#       bus_width_bits: 384        #   vendor        nvidia | amd | intel | apple
#       efficiency: [0.42, 0.55]   #   name          Go regexp, case-insensitive, any match
#       efficiency_source: ...     #   min/max_vram_gib  the card's own memory, when several
#       prompt_ratio: [20, 28]     #                 cards share a name (unknown memory fails it)
#       prompt_ratio_source: ...   #   gpu_cores     Apple: the chip's GPU core count, when
#       source: nvidia-geforce     #                 bandwidth differs by it (unknown fails it)
#       checked: YYYY-MM-DD        #   bandwidth_gbs GB/s (decimal), the vendor's figure
#       note: ...                  #   data_rate_gbps, bus_width_bits  the memory configuration
#                                  #                 the figure is derived from (GDDR parts)
#                                  #   efficiency, prompt_ratio  ONLY where a published
#                                  #                 measurement puts this part outside its
#                                  #                 runtime path's range (estimate.Config);
#                                  #                 each needs its *_source
#
#   system_memory:                 # ORDERED, first match wins. The memory a
#     - id: intel-core-12-14       # processor family supports, for models that
#       cpu: ['regexp']            # run on the processor. What is installed is
#       low_gbs: 25.6              # not read by the advisor, so a row is a
#       high_gbs: 89.6             # RANGE: low is one module of the slowest
#       memory: in words           # supported speed (many laptops ship that
#       source: intel-ark          # way), high is every channel at the fastest.
#       checked: YYYY-MM-DD        # One channel moves MT/s × 8 ÷ 1000 GB/s.
#
# Names are matched after removing (R), (TM), ® and ™ and collapsing spaces
# (hardware.MatchName), the same way runtime-support.yaml's are.

sources:
  nvidia-geforce: "NVIDIA GeForce product specifications — memory configuration and bandwidth per card, https://www.nvidia.com/en-us/geforce/graphics-cards/compare/ (laptop parts: https://www.nvidia.com/en-us/geforce/laptops/compare/)"
  amd-radeon: "AMD Radeon product specifications — memory speed, interface and bandwidth per card, https://www.amd.com/en/products/specifications/graphics.html"
  intel-ark: "Intel ARK product specifications — graphics memory bandwidth for Arc cards, memory types and channels for processors, https://ark.intel.com/"
  amd-processors: "AMD processor specifications — system memory type, speed and channels, https://www.amd.com/en/products/specifications/processors.html"
  apple-specs: "Apple technical specifications and chip announcements — unified memory bandwidth per chip, https://support.apple.com/specs and https://www.apple.com/newsroom/; the same figures head llama.cpp's Apple Silicon table, https://github.com/ggml-org/llama.cpp/discussions/4167 (read 2026-09-19)"
  llamacpp-apple: "llama.cpp, Performance of llama.cpp on Apple Silicon M-series (LLaMA 7B, llama-bench), https://github.com/ggml-org/llama.cpp/discussions/4167, read 2026-09-19"
  llamacpp-vulkan: "llama.cpp, Performance of llama.cpp with Vulkan (Llama 2 7B Q4_0, llama-bench), https://github.com/ggml-org/llama.cpp/discussions/10879, read 2026-09-19"

