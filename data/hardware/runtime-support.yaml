integrated:
  - vendor: apple
    integrated: true
    checked: 2026-09-18
    source: Apple Silicon — the GPU is part of the chip and shares unified memory
  - vendor: nvidia
    name: ['\bGB10\b', '\bTegra\b', '\bJetson\b', '\bOrin\b', '\bXavier\b']
    integrated: true
    checked: 2026-09-18
    source: NVIDIA's system-on-chip GPUs (Jetson, DGX Spark) share memory with the CPU
  - vendor: nvidia
    integrated: false
    checked: 2026-09-18
    source: every other NVIDIA GPU is a discrete card
  - vendor: intel
    # Intel's discrete line: DG1 (Iris Xe MAX), Arc A-series (Alchemist, DG2),
    # Arc B-series (Battlemage); C covers the next generation's naming.
    name: ['\bArc (Pro )?[ABC]\d{2,3}[A-Z]?\b', '\bDG[12]\b', '\bIris Xe MAX\b', '\bBattlemage\b', '\bAlchemist\b']
    integrated: false
    checked: 2026-09-18
    source: Intel Arc product list; pci.ids names ("DG2 [Arc A770]", "Battlemage G21 [Arc B580]")
  - vendor: intel
    # UHD, Iris Xe, "Arc Graphics" (Meteor Lake), "Arc 140V" (Lunar Lake).
    integrated: true
    checked: 2026-09-18
    source: every other Intel GPU is built into the processor
  - vendor: amd
    name:
      - '\bRadeon \d{3}M\b'              # 610M, 680M, 780M, 880M, 890M
      - '\bRadeon 80[4-6]0S\b'           # Strix Halo
      - '\bRadeon (RX )?Vega ([3-9]|1[01])( Graphics)?$'   # Ryzen 2000-5000 APUs (not RX Vega 56/64)
      - '^AMD Radeon Graphics$'          # Windows' name for Ryzen 4000+ and 7000+ desktop graphics
      - '\b(Renoir|Cezanne|Lucienne|Barcelo|Rembrandt|Phoenix|Hawk Point|Strix|Krackan|Raphael|Granite Ridge|Mendocino|Picasso|Raven|Dali|Van Gogh)'   # pci.ids codenames ("Phoenix1", "Strix Halo")
    integrated: true
    checked: 2026-09-18
    source: AMD Ryzen processor graphics names (Windows) and pci.ids codenames (Linux)
  - vendor: amd
    name: ['\bRX\b', '\bRadeon Pro\b', '\bPRO W\d', '\bFirePro\b', '\bInstinct\b', '\bRadeon VII\b', '\bRadeon HD\b', '\bRadeon R[579]\b', '\bNavi\b', '\bVega (10|20|56|64)\b', '\b(Tahiti|Hawaii|Fiji|Polaris|Ellesmere|Baffin|Lexa|Tonga|Pitcairn|Cape Verde|Bonaire|Oland)\b']
    integrated: false
    checked: 2026-09-18
    source: AMD Radeon and Radeon Pro discrete lines; pci.ids codenames
