  - gfx: gfx906
    name: ['\bRadeon (Pro )?VII\b']
    checked: 2026-09-18
    source: Vega 20; LLVM AMDGPU processor table
  - gfx: gfx900
    name: ['\bRX Vega (56|64)\b', '\bVega Frontier\b']
    checked: 2026-09-18
